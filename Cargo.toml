[package]
name = "cleanerio"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "A Mac cleaner that only ever moves things to the Trash"
repository = "https://github.com/TaoMonLae/cleanerio"
readme = "README.md"
publish = false

[dependencies]
dirs = "7.0.0"
eframe = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
plist = "1.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = "0.40.3"
trash = "5.3.0"
winit = "0.30"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
