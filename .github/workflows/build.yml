name: Build

# Builds and tests Cleanerio on Mac, Linux and Windows for every push and pull request,
# and keeps the Windows and Linux programs as downloads on the run's page.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release
      - name: Keep the Windows program
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: cleanerio-windows-x64
          path: target/release/cleanerio.exe
      - name: Keep the Linux program
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: cleanerio-linux-x64
          path: target/release/cleanerio
